# Demo Vote — live audience voting for demo/pitch sessions.
#
# This app makes ZERO LLM calls. There is no agent binding, no API token, and
# no inference cost — for us or for anyone who forks it.
name = "demo-vote"
main = "worker/index.ts"
# No nodejs_compat: the Worker uses only Web Crypto and the D1 binding.
compatibility_date = "2026-07-26"

# Votes are cast once and cannot be recast. When something goes wrong during a
# live event there is no second chance to reproduce it, so keep full logs.
[observability]
enabled = true
head_sampling_rate = 1

# The React SPA is built by @cloudflare/vite-plugin into dist/client.
# `directory` is redundant under the plugin, which injects its own, but
# @cloudflare/vitest-pool-workers parses this file directly and refuses to start
# without it. `not_found_handling` is what makes a refresh on /admin or
# /v/<id> serve index.html instead of a 404.
[assets]
binding = "ASSETS"
directory = "dist/client"
not_found_handling = "single-page-application"

# D1 (not KV) is the source of truth for votes. The one-vote-per-code guarantee
# is a UNIQUE constraint on votes.code, which requires a strongly consistent
# store: KV's eventual consistency would let two concurrent requests both read
# "unused" and double-count. database_id is rewritten at deploy time by
# scripts/set-d1-database-id.mjs.
[[d1_databases]]
binding = "DB"
database_name = "demo-vote-db"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "drizzle"

# Per-IP ceiling on code redemption.
#
# Sized for a room, not for a person. Venue wifi puts every phone behind one NAT
# address, so this key is shared by the whole audience: the organiser says
# "voting is open" and three hundred people type their code inside the next
# minute or two, all of it arriving from one IP. This was 10 per 60s, which is a
# sensible number for one human and a denial of service against an actual event.
#
# The alphabet is what makes guessing hopeless, not this limit. Codes are 8
# characters from a 30-character alphabet, so 30^8 is about 6.6e11 combinations.
# At 600 attempts a minute, a guesser gets 864,000 tries a day, and the chance of
# landing on any one of three hundred live codes is about 4e-4 a day. This limit
# exists to cap the database work a single address can demand, which is what it
# can actually be sized for.
[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "2001"
[ratelimits.simple]
limit = 600
period = 60

# Per-IP limit on admin login attempts, layered under the per-account lockout
# counter in worker/auth.ts.
[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "2002"
[ratelimits.simple]
limit = 5
period = 60

# Keyed on the voting code, NOT on the IP. A venue puts every phone in the room
# behind one NAT address, so an IP limit on this endpoint would be a limit on the
# room.
#
# This is a ceiling on database work, not the anti-double-vote mechanism. That is
# the UNIQUE constraint on votes.code, and it has to stay reachable: the test in
# tests/voting.test.ts fires twenty simultaneous ballots from one code and
# requires nineteen of them to be refused BY THE CONSTRAINT, with a 409. A limit
# below twenty would answer most of them 429 instead, and the one guarantee this
# project cannot get wrong would go untested while every test still passed. Hence
# a limit above that burst: it does nothing to any real voter, and it still caps
# a script pointed at this endpoint with a valid cookie.
[[ratelimits]]
name = "VOTE_RATE_LIMITER"
namespace_id = "2003"
[ratelimits.simple]
limit = 30
period = 60

[vars]
ENVIRONMENT = "production"

# Secrets (never committed). Local: .dev.vars — Production: GitHub environment.
#   ADMIN_PASSWORD  — unlocks /admin
#   VOTE_HMAC_KEY   — signs voter and admin session cookies
