# Demo Vote — live audience voting for demo/pitch sessions.
#
# This app makes ZERO LLM calls. There is no agent binding, no API token, and
# no inference cost — for us or for anyone who forks it.
name = "demo-vote"
main = "worker/index.ts"
# No nodejs_compat: the Worker uses only Web Crypto and the D1 binding.
compatibility_date = "2026-07-26"

# Scores stop being revisable the moment the window closes, and there is no
# second chance to reproduce a live event, so keep full logs.
[observability]
enabled = true
head_sampling_rate = 1

# The React SPA is built by @cloudflare/vite-plugin into dist/client.
# `directory` is redundant under the plugin, which injects its own, but
# @cloudflare/vitest-pool-workers parses this file directly and refuses to start
# without it. `not_found_handling` is what makes a refresh on /admin or
# /v/<id> serve index.html instead of a 404.
[assets]
binding = "ASSETS"
directory = "dist/client"
not_found_handling = "single-page-application"

# D1 (not KV) is the source of truth for scores. One-score-per-demo-per-code is
# a UNIQUE constraint on (code, demo_id), which requires a strongly consistent
# store: KV's eventual consistency would let two concurrent writes for the same
# demo both read "nothing there" and land as two rows, double-counting that demo
# in the sum. database_id is rewritten at deploy time by
# scripts/set-d1-database-id.mjs.
[[d1_databases]]
binding = "DB"
database_name = "demo-vote-db"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "drizzle"

# Per-IP ceiling on code redemption.
#
# Sized for a room, not for a person. Venue wifi puts every phone behind one NAT
# address, so this key is shared by the whole audience: the organiser says
# "voting is open" and three hundred people type their code inside the next
# minute or two, all of it arriving from one IP. This was 10 per 60s, which is a
# sensible number for one human and a denial of service against an actual event.
#
# The alphabet is what makes guessing hopeless, not this limit. Codes are 8
# characters from a 30-character alphabet, so 30^8 is about 6.6e11 combinations.
# At 600 attempts a minute, a guesser gets 864,000 tries a day, and the chance of
# landing on any one of three hundred live codes is about 4e-4 a day. This limit
# exists to cap the database work a single address can demand, which is what it
# can actually be sized for.
[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "2001"
[ratelimits.simple]
limit = 600
period = 60

# Per-IP limit on admin login attempts, layered under the per-account lockout
# counter in worker/auth.ts.
[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "2002"
[ratelimits.simple]
limit = 5
period = 60

# Keyed on the voting code, NOT on the IP. A venue puts every phone in the room
# behind one NAT address, so an IP limit on this endpoint would be a limit on the
# room.
#
# Sized for scoring, which is a different shape of traffic from voting. This was
# 30 a minute, which was generous when a code was entitled to press one button
# once. A code now writes once per demo and again on every adjustment: six demos,
# a couple of passes back over them while the next team sets up, and a minute
# with thirty requests in it is an ordinary attentive voter rather than an
# attack. A limit that low would answer real people 429 in the last minute of the
# window, which is exactly when they are still deciding.
#
# A hundred a minute is still several times what the most indecisive person in
# the room can produce by hand, and it stays low enough that the test which
# proves the ceiling exists can actually clear it: 260 requests in a batched loop
# takes seconds, where clearing a limit of several hundred takes long enough that
# the earliest ones age out of the window and the test stops proving anything.
#
# It remains a ceiling on database work and nothing more. Nothing about the
# integrity of a ballot rests on it: that is UNIQUE(code, demo_id), which turns a
# repeated write into an update rather than a second row however many arrive at
# once. tests/voting.test.ts fires twenty simultaneous writes for one demo and
# requires exactly one row to exist afterwards, so this has to stay above that
# burst for the constraint to be what the test reaches.
[[ratelimits]]
name = "VOTE_RATE_LIMITER"
namespace_id = "2003"
[ratelimits.simple]
limit = 100
period = 60

[vars]
ENVIRONMENT = "production"

# Secrets (never committed). Local: .dev.vars — Production: GitHub environment.
#   ADMIN_PASSWORD  — unlocks /admin
#   VOTE_HMAC_KEY   — signs voter and admin session cookies
